cols=14
rows=20
nThread=6
nAnts=10
nSeeds=180
seedTypes=5
type=1
# Numero di iterazioni della simulazione tra un repaint della board e il successivo.
refreshRate=100
# Criterio di arresto della simulazione: 0 = numero massimo di iterazioni, 1 = soglia di entropia.
stopCriterion=1
# Usato quando stopCriterion=0.
maxIterations=20000
# Usato quando stopCriterion=1 (scala 0-100, valori piu' bassi = semi piu' raggruppati per tipo).
entropyThreshold=5.0
# Seed dello stato iniziale condiviso dalle due copie (euristica / RL). 0 = casuale a ogni run.
masterSeed=0
